<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para ti 💛</title>
  <link rel="icon" href="data:," />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; }
    .webgl { position: fixed; inset: 0; outline: none; }
    #titulo-corazon {
      position: fixed; top: 18px; left:50%; transform:translateX(-50%); z-index:20;
      color:#fff5ad; font-family:Arial, sans-serif; font-size:clamp(1.1rem,2.8vw,2rem);
      font-weight:bold; text-align:center; text-shadow:0 0 10px #ffb300, 0 0 24px #ff7a00;
      pointer-events:none; white-space:nowrap;
    }
    #modal-carta {
      position: fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
      padding:20px; background: rgba(0,0,0,0.58); backdrop-filter: blur(3px);
    }
    #modal-carta.visible { display:flex; }
    .carta {
      width: min(86vw,420px); max-height:90vh; overflow:auto; padding:22px 20px 16px; position:relative;
      border:2px solid #ffe08a; border-radius:18px;
      background: linear-gradient(160deg,#fffdf2 0%,#fff0b8 100%);
      box-shadow: 0 12px 36px rgba(255,190,20,0.45);
      color:#805100; font-family: Georgia, serif; text-align:center; animation:cartaAparece 0.28s ease-out;
    }
    .carta h3 { margin-bottom:10px; font-size:1.25rem; color:#a46100; }
    .carta img { display:block; width:min(100%,320px); max-height:260px; object-fit:cover; margin:0 auto 14px; border:2px solid #ffd84d; border-radius:12px; }
    #mensaje-romantico { color:#8f5600; font-size:clamp(1.05rem,2.5vw,1.35rem); line-height:1.5; text-shadow:0 0 10px rgba(255,180,0,0.18); }
    #cerrar-carta {
      margin-top:14px; padding:8px 16px; border:none; border-radius:999px; background:#e5a900; color:#fff; font-size:0.95rem; font-weight:bold; cursor:pointer;
    }
    #cerrar-carta:hover { background:#c88e00; }
    #inicio {
      position: fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; flex-direction:column;
      padding:24px; background: rgba(0,0,0,0.92); color:#fff5ad; font-family:Arial, sans-serif; text-align:center; cursor:pointer; text-shadow:0 0 15px #ffb300;
    }
    #inicio p:first-child { font-size:clamp(1.8rem,7vw,3.2rem); font-weight:bold; }
    #inicio p:last-child { margin-top:12px; color:#fff; font-size:1rem; opacity:0.85; }
    @keyframes cartaAparece {
      from { opacity:0; transform:scale(0.9) translateY(12px); } to { opacity:1; transform:scale(1) translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .carta { animation: none !important; }
      .webgl { will-change: auto; }
    }
  </style>
</head>
<body>
  <canvas class="webgl" aria-hidden="false"></canvas>
  <div id="titulo-corazon">Toca el corazón 💛</div>

  <div id="modal-carta" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="carta" aria-labelledby="titulo-carta">
      <h3 id="titulo-carta">Para ti 🌻</h3>
      <img src="https://i.postimg.cc/j2cKRQxn/500acd6e8403dc1f2823077d918cd4ad.jpg" alt="Flores amarillas" />
      <p id="mensaje-romantico"></p>
      <button id="cerrar-carta" aria-label="Cerrar carta">Cerrar</button>
    </div>
  </div>

  <div id="inicio" role="button" tabindex="0" aria-label="Iniciar experiencia y reproducir música">
    <p>Toca aquí 💛</p>
    <p>Hay una sorpresa para ti</p>
  </div>

  <!-- Librerías -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    /* =========================
       Config / frases
       ========================= */
    const frases = [
      "Te amo 💛","Eres mi persona favorita","Gracias por existir","Mi lugar seguro",
      "Contigo todo es más bonito","Te quiero muchísimo","Eres mi universo ✨","Mi niña hermosa",
      "Siempre pienso en ti","Me haces muy feliz","Eres muy especial para mí","Mi amor 🌻",
      "Qué bonito coincidir contigo","Siempre tú 💛"
    ];
    const frasesRomanticas = [
      "Así como las flores amarillas llenan de luz cada jardín, tú llenas de alegría y color cada rincón de mi vida. Te regalo estas flores como símbolo de todo lo bonito que siento por ti: cariño, esperanza y un amor que florece cada día. 🌻💛"
    ];

    /* =========================
       Preferencias y rendimiento
       ========================= */
    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const isMobileUA = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth < 700;
    const cpuCores = navigator.hardwareConcurrency || 4;
    const defaultGalaxyCount = 80000;
    let galaxyCount = defaultGalaxyCount;
    if (isMobileUA) galaxyCount = Math.max(6000, Math.floor(defaultGalaxyCount * 0.25));
    if (cpuCores < 4) galaxyCount = Math.max(5000, Math.floor(galaxyCount * (cpuCores / 4)));
    const ORBIT_SYNC_SPEED = reduceMotion ? 0 : 0.003;

    /* =========================
       Escena básica
       ========================= */
    const scene = new THREE.Scene();

    function crearEstrellasFondo(count = 5000) {
      const geometria = new THREE.BufferGeometry();
      const posiciones = new Float32Array(count * 3);
      for (let i = 0; i < posiciones.length; i++) posiciones[i] = (Math.random() - 0.5) * 500;
      geometria.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
      const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true });
      scene.add(new THREE.Points(geometria, material));
    }
    crearEstrellasFondo();

    function crearNubesFondo() {
      const canvas = document.createElement('canvas'); canvas.width = canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const g = ctx.createRadialGradient(128,128,8,128,128,128);
      g.addColorStop(0, "rgba(255,248,190,0.58)");
      g.addColorStop(0.45, "rgba(255,235,120,0.25)");
      g.addColorStop(1, "rgba(255,220,80,0)");
      ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
      const textura = new THREE.CanvasTexture(canvas);
      const grupo = new THREE.Group();
      const n = isMobileUA ? 12 : 30;
      for (let i=0;i<n;i++){
        const nube = new THREE.Sprite(new THREE.SpriteMaterial({
          map: textura, transparent: true, opacity: 0.18 + Math.random() * 0.18, depthWrite:false, blending:THREE.AdditiveBlending
        }));
        const tamaño = 12 + Math.random() * 18;
        nube.scale.set(tamaño * 1.8, tamaño, 1);
        nube.position.set((Math.random()-0.5)*90,(Math.random()-0.5)*55,(Math.random()-0.5)*90);
        nube.rotation.z = Math.random()*Math.PI;
        grupo.add(nube);
      }
      grupo.renderOrder = -1;
      scene.add(grupo);
    }
    crearNubesFondo();

    /* =========================
       Galaxia
       ========================= */
    let galaxy;
    const parametrosGalaxia = {
      count: galaxyCount,
      size: 0.01,
      radius: 6,
      branches: 4,
      spin: 1,
      randomness: 0.2,
      randomnessPower: 3,
      insideColor: "#fff200",
      outsideColor: "#ff7a00"
    };

    function generarGalaxia() {
      if (galaxy) scene.remove(galaxy);
      const geometria = new THREE.BufferGeometry();
      const posiciones = new Float32Array(parametrosGalaxia.count * 3);
      const colores = new Float32Array(parametrosGalaxia.count * 3);
      const colorInterior = new THREE.Color(parametrosGalaxia.insideColor);
      const colorExterior = new THREE.Color(parametrosGalaxia.outsideColor);
      for (let i = 0; i < parametrosGalaxia.count; i++) {
        const i3 = i * 3;
        const radio = Math.random() * parametrosGalaxia.radius;
        const anguloGiro = radio * parametrosGalaxia.spin;
        const anguloBrazo = ((i % parametrosGalaxia.branches) / parametrosGalaxia.branches) * Math.PI * 2;
        const aleatorioX = (Math.random() - 0.5) * parametrosGalaxia.randomness * radio;
        const aleatorioY = (Math.random() - 0.5) * parametrosGalaxia.randomness * radio;
        const aleatorioZ = (Math.random() - 0.5) * parametrosGalaxia.randomness * radio;
        posiciones[i3] = Math.cos(anguloBrazo + anguloGiro) * radio + aleatorioX;
        posiciones[i3 + 1] = aleatorioY;
        posiciones[i3 + 2] = Math.sin(anguloBrazo + anguloGiro) * radio + aleatorioZ;
        const colorMezclado = colorInterior.clone().lerp(colorExterior, radio / parametrosGalaxia.radius);
        colores[i3] = colorMezclado.r; colores[i3 + 1] = colorMezclado.g; colores[i3 + 2] = colorMezclado.b;
      }
      geometria.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
      geometria.setAttribute('color', new THREE.BufferAttribute(colores, 3));
      const material = new THREE.PointsMaterial({ size: parametrosGalaxia.size, vertexColors:true, blending:THREE.AdditiveBlending, depthWrite:false });
      galaxy = new THREE.Points(geometria, material);
      scene.add(galaxy);
    }
    generarGalaxia();

    /* =========================
       Corazón de partículas
       ========================= */
    const geometriaCorazon = new THREE.BufferGeometry();
    const posicionesCorazon = [];
    const coloresCorazon = [];
    const corazonCount = isMobileUA ? 1200 : 3500;
    for (let i = 0; i < corazonCount; i++) {
      const t = Math.random() * Math.PI * 2;
      const escala = Math.random() * 0.6 + 0.4;
      let x = 17 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      let z = (Math.random() - 0.5) * 1;
      x *= escala * 0.15; y *= escala * 0.15; z *= escala * 0.15;
      posicionesCorazon.push(x, y + 2.2, z);
      const color = new THREE.Color(); color.setHSL(0.95 + Math.random() * 0.05, 1, 0.65);
      coloresCorazon.push(color.r, color.g, color.b);
    }
    geometriaCorazon.setAttribute('position', new THREE.Float32BufferAttribute(posicionesCorazon, 3));
    geometriaCorazon.setAttribute('color', new THREE.Float32BufferAttribute(coloresCorazon, 3));
    const materialCorazon = new THREE.PointsMaterial({ size: 0.12, vertexColors:true });
    const corazon = new THREE.Points(geometriaCorazon, materialCorazon);
    scene.add(corazon);

    /* =========================
       Corazón 3D real (opcional)
       ========================= */
    let heartModel = null;
    const cargadorGLTF = new THREE.GLTFLoader();
    const cargadorTextura = new THREE.TextureLoader();
    try { cargadorTextura.crossOrigin = 'anonymous'; } catch (e) {}
    cargadorGLTF.load(
      "https://assets.codepen.io/74321/heart.glb",
      (gltf) => {
        heartModel = gltf.scene;
        heartModel.position.set(0, 3.2, 0);
        heartModel.scale.set(1.2, 1.2, 1.2);
        const matcap = cargadorTextura.load("https://assets.codepen.io/74321/3.png");
        heartModel.traverse((obj) => {
          if (obj.isMesh) {
            obj.material = new THREE.MeshMatcapMaterial({ matcap, color: new THREE.Color("#ff3366") });
            obj.castShadow = false;
            obj.receiveShadow = false;
          }
        });
        scene.add(heartModel);
      },
      undefined,
      () => { console.log("No se pudo cargar el corazón 3D; se usará el corazón de partículas."); }
    );

    /* =========================
       Textos flotantes
       ========================= */
    function crearTexto(mensaje, tamaño = 1.8) {
      const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = "bold 50px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = Math.random() < 0.5 ? "#ffffff" : "#ffe21a";
      ctx.fillText(mensaje, canvas.width / 2, canvas.height / 2);
      const textura = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: textura, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(tamaño * 4, tamaño, 1);
      return sprite;
    }
    const textoSprites = [];
    const textoCount = isMobileUA ? 30 : 90;
    for (let i=0;i<textoCount;i++){
      const texto = crearTexto(frases[Math.floor(Math.random()*frases.length)], 1 + Math.random());
      const x = (Math.random()-0.5)*40; let y = (Math.random()-0.5)*25; const z = (Math.random()-0.5)*40;
      if (Math.abs(x) < 5 && Math.abs(y) < 5) y += 7;
      texto.position.set(x, y, z);
      texto.userData = {
        baseY: y,
        orbitRadius: Math.sqrt(x*x + z*z),
        orbitAngle: Math.atan2(z, x),
        orbitSpeed: ORBIT_SYNC_SPEED,
        floatAmp: Math.random()*0.6 + 0.2,
        floatSpeed: Math.random()*0.8 + 0.6,
        phase: Math.random() * Math.PI * 2,
        baseSize: 1 + Math.random()
      };
      scene.add(texto);
      textoSprites.push(texto);
    }

    /* =========================
       Cámara y renderer
       ========================= */
    const tamaños = { width: window.innerWidth, height: window.innerHeight };
    const camera = new THREE.PerspectiveCamera(75, tamaños.width / tamaños.height, 0.1, 600);
    camera.position.set(10, 12, 20);
    scene.add(camera);
    const canvasWebGL = document.querySelector('.webgl');
    const renderer = new THREE.WebGLRenderer({ canvas: canvasWebGL, antialias: true });
    renderer.setSize(tamaños.width, tamaños.height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    const controles = new THREE.OrbitControls(camera, renderer.domElement);
    controles.enableDamping = true;
    const reloj = new THREE.Clock();
    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 0.35;
    const mouse = new THREE.Vector2();

    /* =========================
       Modal / interacciones
       ========================= */
    const modalCarta = document.getElementById('modal-carta');
    const mensajeRomantico = document.getElementById('mensaje-romantico');
    const cerrarCarta = document.getElementById('cerrar-carta');
    const inicio = document.getElementById('inicio');
    const musica = new Audio();
    musica.loop = true;
    musica.preload = 'auto';
    musica.src = "https://github.com/Baque2005/Organizador/raw/refs/heads/master/PUBLIC%20-%20Make%20You%20Mine%20%20Sub%20espa%C3%B1ol%20(lyrics).mp3";

    let previousFocus = null;

    function mostrarMensajeRomantico() {
      const mensaje = frasesRomanticas[Math.floor(Math.random() * frasesRomanticas.length)];
      mensajeRomantico.textContent = mensaje;
      modalCarta.classList.add('visible');
      modalCarta.setAttribute('aria-hidden', 'false');
      previousFocus = document.activeElement;
      cerrarCarta.focus();
    }
    function cerrarMensajeRomantico() {
      modalCarta.classList.remove('visible');
      modalCarta.setAttribute('aria-hidden', 'true');
      if (previousFocus) previousFocus.focus();
    }
    cerrarCarta.addEventListener('click', cerrarMensajeRomantico);
    modalCarta.addEventListener('click', (e) => { if (e.target === modalCarta) cerrarMensajeRomantico(); });

    canvasWebGL.addEventListener('pointerdown', (evento) => {
      if (inicio && getComputedStyle(inicio).display !== 'none') return;
      mouse.x = (evento.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(evento.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const objetos = heartModel ? [heartModel, corazon] : [corazon];
      const impactos = raycaster.intersectObjects(objetos, true);
      if (impactos.length > 0) mostrarMensajeRomantico();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalCarta.classList.contains('visible')) {
        cerrarMensajeRomantico();
      }
    });

    function startExperience() {
      inicio.style.display = 'none';
      musica.play().catch(() => { console.log('El navegador no permitió reproducir la música automáticamente.'); });
    }
    inicio.addEventListener('click', startExperience);
    inicio.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startExperience(); } });

    /* =========================
       Animación
       ========================= */
    function animar() {
      const tiempo = reloj.getElapsedTime();
      if (!reduceMotion) {
        if (galaxy) galaxy.rotation.y += 0.001;
        corazon.rotation.y += ORBIT_SYNC_SPEED;
        corazon.rotation.z = Math.sin(tiempo * 1.7) * 0.08;
        if (heartModel) {
          heartModel.rotation.y += 0.01;
          heartModel.rotation.x = Math.sin(tiempo * 1.8) * 0.1;
          heartModel.position.y = 3.2 + Math.sin(tiempo * 2.2) * 0.25;
        }
      }

      textoSprites.forEach((texto) => {
        const datos = texto.userData;
        datos.orbitAngle += datos.orbitSpeed;
        texto.position.x = Math.cos(datos.orbitAngle) * datos.orbitRadius;
        texto.position.z = Math.sin(datos.orbitAngle) * datos.orbitRadius;
        texto.position.y = datos.baseY + Math.sin(tiempo * datos.floatSpeed + datos.phase) * datos.floatAmp;
        const pulso = 1 + Math.sin(tiempo * 2.4 + datos.phase) * 0.1;
        texto.scale.set(datos.baseSize * 4 * pulso, datos.baseSize * pulso, 1);
        texto.material.opacity = 0.72 + Math.sin(tiempo * 1.9 + datos.phase) * 0.2;
        texto.lookAt(camera.position);
      });

      controles.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animar);
    }
    animar();

    window.addEventListener('resize', () => {
      tamaños.width = window.innerWidth;
      tamaños.height = window.innerHeight;
      camera.aspect = tamaños.width / tamaños.height;
      camera.updateProjectionMatrix();
      renderer.setSize(tamaños.width, tamaños.height);
    });

    // Accessibility: ensure focusable close button is reachable via keyboard
    cerrarCarta.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && modalCarta.classList.contains('visible')) {
        e.preventDefault();
        cerrarMensajeRomantico();
      }
    });
  </script>
</body>
</html>
